name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  test-ssh-connection:
    name: Test VPS SSH Connection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Display secrets (masked)
        run: |
          echo "VPS Host: ${{ secrets.VPS_HOST }}"
          echo "VPS Username: ${{ secrets.VPS_USERNAME }}"
          echo "VPS Port: ${{ secrets.VPS_PORT }}"
          echo "SSH Key length: ${#SSH_KEY}"
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "========================================="
            echo "SSH Connection Successful!"
            echo "========================================="
            echo ""
            echo "System Information:"
            echo "- Hostname: $(hostname)"
            echo "- User: $(whoami)"
            echo "- OS: $(grep PRETTY_NAME /etc/os-release | cut -d '"' -f 2)"
            echo "- Kernel: $(uname -r)"
            echo ""
            echo "K3s Information:"
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            k3s --version || echo "K3s not found"
            kubectl version --client --short 2>/dev/null || kubectl version --client 2>/dev/null || echo "kubectl not found"
            echo ""
            echo "Cluster State:"
            kubectl get nodes 2>/dev/null || echo "Cannot reach cluster"
            echo ""
            echo "Namespaces:"
            kubectl get namespaces 2>/dev/null || echo "Cannot list namespaces"
            echo ""
            echo "Disk Space:"
            df -h / | tail -1
            echo ""
            echo "Memory:"
            free -h | grep Mem
            echo ""
            echo "========================================="
            echo "All checks completed!"
            echo "========================================="

      - name: Validate K3s deployment access
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            echo "Checking test namespace..."
            kubectl get namespace test 2>/dev/null \
              && echo "test namespace exists" \
              || echo "test namespace NOT found — run deploy.sh first"
            echo ""
            echo "Checking eureka-server deployment..."
            kubectl get deployment eureka-server -n test 2>/dev/null \
              && echo "eureka-server deployment exists" \
              || echo "eureka-server NOT deployed yet"
            echo ""
            echo "Checking GHCR image pull secret..."
            kubectl get secret ghcr-credentials -n test 2>/dev/null \
              && echo "ghcr-credentials secret exists" \
              || echo "ghcr-credentials NOT found — run manage-secrets.sh first"

      - name: Success Summary
        if: success()
        run: |
          echo "SSH Connection Test PASSED!"
          echo ""
          echo "GitHub Actions can successfully connect to your VPS"
          echo "K3s is installed and accessible"
          echo ""
          echo "You're ready to deploy via cd.yml!"

      - name: Failure Summary
        if: failure()
        run: |
          echo "SSH Connection Test FAILED!"
          echo ""
          echo "Please check:"
          echo "1. VPS_HOST is correct (IP or domain)"
          echo "2. VPS_USERNAME is correct"
          echo "3. VPS_SSH_KEY contains the complete private key"
          echo "4. VPS_PORT is correct (usually 22)"
          echo "5. SSH key is added to ~/.ssh/authorized_keys on VPS"
          echo "6. VPS firewall allows SSH connections"
          echo "7. K3s is installed: curl -sfL https://get.k3s.io | sh -"
