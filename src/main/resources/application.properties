# ============================================
#        EUREKA DISCOVERY SERVER - BASE
# ============================================

spring.application.name=discovery-server
server.port=8761

# ============================================
#        ACTUATOR / PROMETHEUS
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.prometheus.metrics.export.enabled=true

management.endpoint.health.group.liveness.include=livenessState,diskSpace
management.endpoint.health.group.readiness.include=readinessState

# ============================================
#        INFO ENDPOINT
# ============================================
management.info.env.enabled=true
management.info.build.enabled=true
management.info.java.enabled=false
management.info.os.enabled=false

info.app.name=${spring.application.name}
info.app.description=Netflix Eureka Discovery Server for Caicedo Seguros microservices

# ============================================
#        MICROMETER TAGS
# ============================================
management.metrics.tags.application=${spring.application.name}

# ============================================
#        TOMCAT TUNING
# ============================================
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.connection-timeout=10000
server.tomcat.max-connections=200
server.tomcat.accept-count=50

# ============================================
#        COMPRESSION
# ============================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=512

# ============================================
#        GRACEFUL SHUTDOWN
# ============================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================
#        EUREKA SERVER - PERFORMANCE OPTIMIZED
# ============================================
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-auto-expiration-in-seconds=30
eureka.server.response-cache-update-interval-ms=5000
eureka.server.use-read-only-response-cache=true
eureka.server.disable-delta=false
eureka.server.delta-retention-timer-interval-in-ms=180000
eureka.server.retention-time-in-m-s-in-delta-queue=180000
eureka.server.wait-time-in-ms-when-sync-empty=0
eureka.server.registry-sync-retries=3
eureka.server.registry-sync-retry-wait-ms=1000

# ============================================
#        EUREKA PEER REPLICATION
# ============================================
eureka.server.max-threads-for-peer-replication=5
eureka.server.max-elements-in-peer-replication-pool=1000
eureka.server.peer-node-read-timeout-ms=1000
eureka.server.peer-node-connect-timeout-ms=1000
eureka.server.peer-eureka-nodes-update-interval-ms=300000
eureka.server.renewal-percent-threshold=0.85
eureka.server.renewal-threshold-update-interval-ms=600000

# ============================================
#        SPRING CACHE (Eureka metadata cache)
# ============================================
spring.cache.cache-names=eureka-metadata
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=5m

# ============================================
#        ADVANCED METRICS (Spring Boot 4.x compatible)
# ============================================
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.http=true
management.metrics.enable.tomcat=true
management.metrics.enable.logback=true

# Histogramas para percentiles
management.metrics.distribution.percentiles-histogram.http.server.requests=true